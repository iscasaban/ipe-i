<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPEI — Examen de Simulación · Modelo 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Raleway:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primario: #00b4d8;
      --color-primario-oscuro: #0077b6;
      --color-acento: #f4a261;
      --color-fondo: #f0f8ff;
      --color-blanco: #ffffff;
      --color-texto: #1d3557;
      --color-texto-suave: #4a6580;
      --color-tag-bg: #e0f7fa;
      --color-tag-texto: #006d8f;
      --color-border: #cce3f0;
      --color-border-light: #ddeef8;
      --color-correct-bg: #e6f9f2;
      --color-correct-text: #1a7a55;
      --color-wrong-bg: #fdeaea;
      --color-wrong-text: #b83232;
      --radio: 14px;
      --radio-sm: 8px;
      --sombra: 0 4px 18px rgba(0,119,182,0.10);
      --sombra-hover: 0 8px 28px rgba(0,119,182,0.18);
      --fuente-titulo: 'Raleway', sans-serif;
      --fuente-cuerpo: 'Nunito', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--fuente-titulo),sans-serif,sans-serif;
      background: var(--color-fondo);
      color: var(--color-texto);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── QUIZ WRAPPER ── */
    #quiz-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 1.2rem 3rem;
    }

    /* ── HEADER ── */
    .qz-header {
      background: linear-gradient(135deg, var(--color-primario-oscuro) 0%, var(--color-primario) 100%);
      color: #fff;
      padding: 1.6rem 1.5rem 1.2rem;
      border-radius: var(--radio) var(--radio) 0 0;
      position: relative;
      overflow: hidden;
    }
    .qz-header::before {
      content: '1';
      font-family: var(--fuente-titulo),sans-serif;
      font-size: 6rem;
      font-weight: 900;
      opacity: 0.10;
      position: absolute;
      right: 1rem;
      top: -0.5rem;
      line-height: 1;
    }
    .qz-header .modelo-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.8;
      margin-bottom: 0.3rem;
    }
    .qz-header h1 {
      font-family: var(--fuente-titulo),sans-serif;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 900;
      line-height: 1.2;
    }
    .qz-header .subtitle {
      font-size: 0.82rem;
      opacity: 0.8;
      margin-top: 0.3rem;
    }

    /* ── PROGRESS ── */
    .pb-wrap {
      height: 5px;
      background: rgba(255,255,255,0.25);
      border-radius: 0;
    }
    .pb {
      height: 100%;
      background: #fff;
      border-radius: 0 3px 3px 0;
      transition: width 0.35s ease;
    }

    /* ── MAIN CARD ── */
    .qz-body {
      background: var(--color-blanco);
      border-radius: 0 0 var(--radio) var(--radio);
      box-shadow: var(--sombra);
      padding: 1.6rem 1.5rem 1.4rem;
    }

    /* ── STATS BAR ── */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--color-texto-suave);
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--color-border-light);
    }
    .stats-bar .qnum {
      font-weight: 800;
      color: var(--color-primario-oscuro);
      font-size: 0.88rem;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-primario);
      background: var(--color-tag-bg);
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      margin-bottom: 0.8rem;
    }

    /* ── QUESTION ── */
    .qt {
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-texto);
      line-height: 1.5;
      margin-bottom: 1.2rem;
    }

    /* ── OPTIONS ── */
    .opts { display: flex; flex-direction: column; gap: 0.6rem; }

    .opt {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 1rem;
      border-radius: var(--radio-sm);
      border: 1.5px solid var(--color-border);
      background: var(--color-blanco);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-texto-suave);
      text-align: left;
      transition: border-color 0.15s, background 0.15s, transform 0.12s;
      width: 100%;
    }
    .opt:hover:not(:disabled) {
      border-color: var(--color-primario);
      background: #f0faff;
      transform: translateX(3px);
    }
    .opt:disabled { cursor: default; }

    .olbl {
      min-width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 800;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      font-family: var(--fuente-titulo),sans-serif,sans-serif;
    }

    .opt.selected { border-color: var(--color-primario-oscuro); background: #edf6ff; }
    .opt.selected .olbl { background: var(--color-primario-oscuro); border-color: var(--color-primario-oscuro); color: #fff; }

    .opt.correct { border-color: #1D9E75; background: var(--color-correct-bg); color: var(--color-correct-text); }
    .opt.correct .olbl { background: #1D9E75; border-color: #1D9E75; color: #fff; }

    .opt.wrong { border-color: #E24B4A; background: var(--color-wrong-bg); color: var(--color-wrong-text); }
    .opt.wrong .olbl { background: #E24B4A; border-color: #E24B4A; color: #fff; }

    .opt.show-correct { border-color: #1D9E75; background: var(--color-correct-bg); color: var(--color-correct-text); }
    .opt.show-correct .olbl { background: #1D9E75; border-color: #1D9E75; color: #fff; }

    /* ── EXPLANATION ── */
    .exp-box {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      background: #f5fbff;
      border-left: 4px solid var(--color-primario);
      border-radius: var(--radio-sm);
      font-size: 0.84rem;
      color: var(--color-texto-suave);
      font-style: italic;
      display: none;
    }
    .exp-box.visible { display: block; }

    /* ── NAV ── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.4rem;
      gap: 0.6rem;
    }
    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: var(--radio-sm);
      border: 1.5px solid var(--color-border);
      background: var(--color-blanco);
      color: var(--color-texto-suave);
      font-family: var(--fuente-titulo),sans-serif,sans-serif;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, filter 0.15s;
    }
    .btn:hover:not(:disabled) { background: var(--color-fondo); border-color: var(--color-primario); }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn.pri {
      background: var(--color-primario-oscuro);
      border-color: var(--color-primario-oscuro);
      color: #fff;
    }
    .btn.pri:hover:not(:disabled) { filter: brightness(0.88); }
    .btn.blank { font-size: 0.8rem; color: var(--color-texto-suave); }

    /* ── RESULTS ── */
    .res {
      background: var(--color-blanco);
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .sc-circle {
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 5px solid var(--color-primario);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      margin: 0 auto 1rem;
    }
    .sc-circle.passed { border-color: #1D9E75; }
    .sc-circle.failed { border-color: #E24B4A; }
    .sc-big { font-family: var(--fuente-titulo),sans-serif; font-size: 2rem; font-weight: 900; color: var(--color-texto); }
    .sc-den { font-size: 0.72rem; color: var(--color-texto-suave); }
    .res-t { font-family: var(--fuente-titulo),sans-serif; font-size: 1.3rem; font-weight: 900; color: var(--color-primario-oscuro); margin-bottom: 0.3rem; }
    .res-s { font-size: 0.82rem; color: var(--color-texto-suave); margin-bottom: 1.2rem; }

    .score-formula {
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 8px;
      margin-bottom: 1.2rem; font-size: 0.82rem;
    }
    .sf-item { padding: 4px 10px; border-radius: 20px; font-weight: 700; }
    .correct-sf { background: var(--color-correct-bg); color: var(--color-correct-text); }
    .wrong-sf   { background: var(--color-wrong-bg);   color: var(--color-wrong-text); }
    .sf-sep     { color: var(--color-texto-suave); font-weight: 700; }
    .sf-result  { font-weight: 800; color: var(--color-texto); font-size: 0.94rem; }

    .sg {
      display: flex; justify-content: center; gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .sc { text-align: center; }
    .sc-n { font-family: var(--fuente-titulo),sans-serif; font-size: 1.5rem; font-weight: 900; }
    .sc-l { font-size: 0.75rem; color: var(--color-texto-suave); font-weight: 600; }

    .rev { margin-top: 1.5rem; text-align: left; }
    .rev-t { font-family: var(--fuente-titulo),sans-serif; font-size: 1rem; font-weight: 900; color: var(--color-primario-oscuro); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--color-tag-bg); }

    .tema-block { margin-bottom: 1.4rem; }
    .tema-block-title { font-size: 0.72rem; font-weight: 700; color: var(--color-texto-suave); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.6rem; padding-bottom: 0.4rem; border-bottom: 1px dashed var(--color-border-light); }

    .ri {
      padding: 0.7rem 0.9rem;
      border-radius: var(--radio-sm);
      border: 1.5px solid var(--color-correct-bg);
      background: var(--color-correct-bg);
      margin-bottom: 0.5rem;
      font-size: 0.83rem;
      color: var(--color-correct-text);
    }
    .ri.rw { background: var(--color-wrong-bg); border-color: var(--color-wrong-bg); color: var(--color-wrong-text); }
    .ri.rb { background: #f5f5f5; border-color: #e0e0e0; color: #888; }
    .ri-detail { display: block; margin-top: 4px; font-size: 0.78rem; }
    .ri-exp { display: block; margin-top: 4px; font-size: 0.76rem; opacity: 0.8; font-style: italic; color: var(--color-texto-suave); }

    .btn-reiniciar { margin: 0.5rem auto 1.5rem; display: block; }

    @media (max-width: 500px) {
      .nav .btn.blank { display: none; }
      .score-formula { font-size: 0.75rem; }
      .sg { gap: 1rem; }
    }
  </style>
</head>
<body>
<div id="quiz-wrap">
  <div class="qz-header">
    <div class="pb-wrap"><div class="pb" id="pb" style="width:0%"></div></div>
    <div style="padding: 1rem 0 0;">
      <div class="modelo-label">IPEI · Examen de Simulación</div>
      <h1>Modelo 1 — 40 preguntas</h1>
      <div class="subtitle">T1 · T2 · T3 · T4 · T5 &nbsp;|&nbsp; Respuestas incorrectas restan ¼ del valor</div>
    </div>
  </div>
  <div class="qz-body" id="qz-body"></div>
</div>

<script>
  const TEMAS = {
    1: "Tema 1 · Características del Sector Productivo",
    2: "Tema 2 · Prevención de Riesgos Laborales",
    3: "Tema 3 · Derecho Laboral",
    4: "Tema 4 · Autoorientación e Inserción Profesional",
    5: "Tema 5 · Estrategias de Aprendizaje Autónomo"
  };

  const qs = [
    // ── TEMA 1 (P01–P08) ──
    { tema:1, q:"¿En cuántos grandes subsectores se divide el sector productivo?", opts:["Dos: público y privado","Tres: agrícola, industrial y de servicios","Cuatro: primario, secundario, terciario y cuaternario","Dos: bienes y servicios"], c:1, exp:"El sector productivo se divide en tres grandes subsectores: agrícola, industrial y de servicios." },
    { tema:1, q:"¿Qué evalúa el análisis del \"tamaño del mercado\" dentro del sector productivo?", opts:["El número de trabajadores de una empresa","Las barreras de entrada al mercado","La dimensión del mercado en términos de producción y consumo","El nivel de innovación tecnológica del sector"], c:2, exp:"El análisis del tamaño del mercado evalúa la dimensión del mercado en términos de producción y consumo." },
    { tema:1, q:"¿Cuál de los siguientes es un componente del perfil profesional?", opts:["El número de empleados de la empresa","Las competencias técnicas del candidato","El tamaño del mercado en el que trabaja","La oferta educativa disponible en el país"], c:1, exp:"Las competencias técnicas del candidato son un componente clave del perfil profesional." },
    { tema:1, q:"Las habilidades blandas incluyen:", opts:["Manejo de maquinaria industrial","Conocimientos en biotecnología","Comunicación, trabajo en equipo y liderazgo","Programación y análisis de datos"], c:2, exp:"Las habilidades blandas (soft skills) incluyen comunicación, trabajo en equipo y liderazgo, entre otras." },
    { tema:1, q:"¿Qué es un yacimiento de ocupación?", opts:["Una bolsa de empleo para titulados universitarios","La posibilidad de crear empleo para satisfacer nuevas necesidades sociales","Un registro oficial de puestos vacantes en la Administración pública","Un recurso natural que genera puestos de trabajo"], c:1, exp:"Un yacimiento de ocupación es la posibilidad de crear empleo para satisfacer nuevas necesidades sociales." },
    { tema:1, q:"¿Cuáles son los tres factores a los que se puede asociar la existencia de nuevos yacimientos de ocupación?", opts:["Educación, sanidad y tecnología","Estilos de vida, servicios y regímenes fiscales","Demografía, economía y legislación","Globalización, digitalización y sostenibilidad"], c:1, exp:"Los nuevos yacimientos de ocupación se asocian a estilos de vida, servicios y regímenes fiscales." },
    { tema:1, q:"¿Cuáles son los principales yacimientos de ocupación en España?", opts:["Minería, agricultura y pesca","Envejecimiento de la población, ecología y nuevas tecnologías aplicadas al marketing digital","Construcción, turismo y hostelería","Administración pública, sanidad y educación"], c:1, exp:"En España, los principales yacimientos de ocupación son el envejecimiento de la población, la ecología y las nuevas tecnologías aplicadas al marketing digital." },
    { tema:1, q:"¿Qué es la Oferta Pública de Empleo (OPE)?", opts:["Un portal web de ofertas de trabajo del sector privado","El proceso anual en que las Administraciones anuncian plazas disponibles mediante oposiciones","Un servicio de intermediación laboral para desempleados","Un contrato de trabajo temporal con la Administración"], c:1, exp:"La OPE es el proceso anual por el que las Administraciones públicas anuncian las plazas disponibles que se cubrirán mediante oposiciones o concursos." },
    // ── TEMA 2 (P25–P32) ──
    { tema:2, q:"¿Qué es un riesgo profesional?", opts:["La probabilidad de que un trabajador sea despedido","La situación de peligro en la que una persona se encuentra por culpa del trabajo en condiciones peligrosas o nocivas","Cualquier enfermedad que padezca un trabajador","El nivel de estrés acumulado durante la jornada laboral"], c:1, exp:"Un riesgo profesional es la situación de peligro en la que una persona se encuentra por culpa del trabajo en condiciones peligrosas o nocivas." },
    { tema:2, q:"Según el método del INSST, ¿qué nivel de riesgo existe si la probabilidad es alta y las consecuencias son extremadamente perjudiciales?", opts:["Riesgo moderado","Riesgo importante","Riesgo intolerable","Riesgo tolerable"], c:2, exp:"Según el método del INSST, cuando la probabilidad es alta y las consecuencias son extremadamente perjudiciales, el nivel de riesgo es intolerable." },
    { tema:2, q:"¿Cuál es el primer paso en la evaluación de la prevención de riesgos?", opts:["Planificar la acción preventiva","Identificar los posibles riesgos laborales","Evaluar la gravedad de los accidentes ocurridos","Redactar el plan de prevención"], c:1, exp:"El primer paso en la evaluación de la prevención de riesgos es identificar los posibles riesgos laborales." },
    { tema:2, q:"Legalmente, ¿qué es un accidente de trabajo según la LGSS?", opts:["Cualquier enfermedad relacionada con el trabajo","Cualquier lesión corporal sufrida en ocasión o como consecuencia del trabajo por cuenta ajena","Solo los accidentes ocurridos dentro del centro de trabajo","Los accidentes debidos a imprudencia del trabajador"], c:1, exp:"Según la LGSS, accidente de trabajo es cualquier lesión corporal sufrida en ocasión o como consecuencia del trabajo por cuenta ajena." },
    { tema:2, q:"¿Cómo se denomina el accidente que ocurre en el trayecto de ida o vuelta al trabajo?", opts:["Accidente blanco","Accidente laboral indirecto","Accidente in itinere","Accidente intercurrente"], c:2, exp:"El accidente in itinere es el que ocurre en el trayecto de ida o vuelta al trabajo." },
    { tema:2, q:"¿Qué es el \"accidente blanco\"?", opts:["Un accidente que ocurre fuera del horario laboral","Un accidente sin daños personales, aunque puede causar daños materiales o interrumpir el trabajo","Un accidente provocado por condiciones climáticas adversas","Un accidente que solo afecta a trabajadores temporales"], c:1, exp:"El accidente blanco es aquel que no produce daños personales pero puede causar daños materiales o interrumpir el proceso de trabajo." },
    { tema:2, q:"¿Cuál de las siguientes NO es una patología inespecífica?", opts:["Fatiga","Estrés laboral","Burnout","Silicosis"], c:3, exp:"La silicosis es una enfermedad profesional específica causada por la inhalación de polvo de sílice, no una patología inespecífica." },
    { tema:2, q:"El estrés laboral se puede traducir en:", opts:["Mayor productividad y concentración","Agresividad, ansiedad, sensación de impotencia o frustración","Mejora de las relaciones laborales","Reducción de la jornada laboral"], c:1, exp:"El estrés laboral puede traducirse en agresividad, ansiedad, sensación de impotencia o frustración, entre otras manifestaciones." },
    // ── TEMA 3 (P01–P08) ──
    { tema:3, q:"¿Cuál de las siguientes características NO forma parte del trabajo regulado por el derecho laboral?", opts:["Voluntario","Gratuito","Dependiente","Personal"], c:1, exp:"El trabajo regulado por el derecho laboral es voluntario, dependiente, personal y retribuido. La gratuidad lo excluye del ámbito laboral." },
    { tema:3, q:"¿Qué norma ocupa el nivel más alto en la jerarquía del ordenamiento laboral español?", opts:["El Estatuto de los Trabajadores","Los convenios colectivos","La Constitución Española de 1978","Los reales decretos"], c:2, exp:"La Constitución Española de 1978 ocupa el nivel más alto de la jerarquía normativa del ordenamiento laboral español." },
    { tema:3, q:"Los convenios colectivos son fuente exclusiva del derecho laboral. ¿Qué significa esto?", opts:["Solo pueden ser firmados por el Estado","No existen como fuente en otras ramas del derecho","Son obligatorios únicamente para los trabajadores","Solo tienen validez en el ámbito autonómico"], c:1, exp:"Que los convenios colectivos sean fuente exclusiva del derecho laboral significa que no existen como fuente en otras ramas del derecho." },
    { tema:3, q:"¿Qué ley regula el trabajo autónomo?", opts:["El Estatuto de los Trabajadores (ET)","La Ley Orgánica 11/1985 de Libertad Sindical","La Ley 20/2007 del Estatuto del Trabajador Autónomo","La Ley General de la Seguridad Social"], c:2, exp:"El trabajo autónomo está regulado por la Ley 20/2007 del Estatuto del Trabajador Autónomo." },
    { tema:3, q:"¿En qué tipo de relación laboral se encuadran los deportistas profesionales?", opts:["Ordinaria","Excluida del ordenamiento laboral","Especial","Autónoma"], c:2, exp:"Los deportistas profesionales tienen una relación laboral especial, regulada por normativa específica." },
    { tema:3, q:"¿Cuál de los siguientes colectivos está EXCLUIDO del ámbito del Estatuto de los Trabajadores?", opts:["Trabajadores del hogar familiar","Penados en instituciones penitenciarias","Funcionarios públicos","Deportistas profesionales"], c:2, exp:"Los funcionarios públicos están excluidos del ámbito del Estatuto de los Trabajadores y se rigen por su propia normativa." },
    { tema:3, q:"¿En qué artículo del Estatuto de los Trabajadores se recogen los derechos básicos y específicos del trabajador?", opts:["Artículo 3","Artículo 5","Artículo 4","Artículo 6"], c:2, exp:"El artículo 4 del Estatuto de los Trabajadores recoge los derechos básicos y específicos de los trabajadores." },
    { tema:3, q:"¿Cuál de las siguientes es una OBLIGACIÓN del trabajador según el art. 5 ET?", opts:["Proporcionar equipos de protección individual","Elaborar el plan de prevención de riesgos","No concurrir con la actividad de la empresa","Vigilar el cumplimiento de la jornada laboral"], c:2, exp:"El artículo 5 ET establece como obligación del trabajador no concurrir con la actividad de la empresa, entre otras." },
    // ── TEMA 4 (P01–P08) ──
    { tema:4, q:"¿Qué es el perfil disponible?", opts:["El conjunto de competencias que exige el mercado laboral","Las competencias, habilidades y experiencias que una persona posee en un momento dado","El plan de estudios que debe seguir un profesional","El perfil publicado en LinkedIn"], c:1, exp:"El perfil disponible es el conjunto de competencias, habilidades y experiencias que una persona posee en un momento dado." },
    { tema:4, q:"¿Qué es el perfil exigible?", opts:["Las habilidades que una persona tiene tras años de experiencia","El currículum vitae actualizado","El conjunto de competencias que se espera tener al finalizar un programa de estudios","Los requisitos mínimos para acceder a la universidad"], c:2, exp:"El perfil exigible es el conjunto de competencias que se espera tener al finalizar un programa de estudios o para acceder a un puesto." },
    { tema:4, q:"¿Cuál es el primer paso para comparar el perfil disponible con el exigible?", opts:["Crear un plan de acción inmediatamente","Identificar las competencias clave del programa académico y hacer un autoanálisis","Buscar ofertas de empleo en el sector","Pedir una carta de recomendación"], c:1, exp:"El primer paso es identificar las competencias clave del programa académico y realizar un autoanálisis para compararlas con las propias." },
    { tema:4, q:"En la metodología SMART, ¿qué significa la letra \"M\"?", opts:["Motivador","Medible","Manejable","Multidisciplinar"], c:1, exp:"En la metodología SMART, la M significa Medible: el objetivo debe poder cuantificarse para evaluar su cumplimiento." },
    { tema:4, q:"¿Cuál de los siguientes es un ejemplo de objetivo SMART correcto?", opts:["\"Quiero mejorar mis habilidades algún día\"","\"Me gustaría trabajar en algo relacionado con mi carrera\"","\"Obtener una certificación en gestión de proyectos en los próximos 6 meses\"","\"Ser el mejor profesional de mi sector\""], c:2, exp:"Un objetivo SMART es específico, medible, alcanzable, relevante y temporal. Solo la opción c cumple todos esos criterios." },
    { tema:4, q:"¿Cuál de las siguientes NO es una competencia personal valorada para la empleabilidad?", opts:["Autoconfianza","Resiliencia","Gestión del tiempo","Cierre patronal"], c:3, exp:"El cierre patronal es una medida de conflicto laboral, no una competencia personal relacionada con la empleabilidad." },
    { tema:4, q:"La comunicación efectiva, el trabajo en equipo y el liderazgo son ejemplos de:", opts:["Competencias técnicas","Requisitos académicos","Competencias sociales","Habilidades exclusivas del sector TIC"], c:2, exp:"La comunicación efectiva, el trabajo en equipo y el liderazgo son competencias sociales, clave para la empleabilidad." },
    { tema:4, q:"¿Qué incluye la autoestima según el tema?", opts:["Solo la autoimagen física","Autoimagen, autoeficacia y autovaloración","La valoración que hacen de ti los demás","El nivel de estudios alcanzado"], c:1, exp:"La autoestima incluye autoimagen (cómo me veo), autoeficacia (creencia en mis capacidades) y autovaloración (cuánto me valoro)." },
    // ── TEMA 5 (P01–P08) ──
    { tema:5, q:"¿Qué es el aprendizaje autónomo?", opts:["Estudiar sin ningún tipo de recurso externo","La capacidad de tomar control y responsabilidad sobre el propio proceso de aprendizaje","Aprender únicamente a través de plataformas digitales","El aprendizaje que se realiza en solitario, sin interacción con otros"], c:1, exp:"El aprendizaje autónomo es la capacidad de tomar control y responsabilidad sobre el propio proceso de aprendizaje." },
    { tema:5, q:"¿Cómo se definen las competencias en el tema?", opts:["Títulos académicos obtenidos a lo largo de la carrera profesional","Herramientas digitales para gestionar el aprendizaje","Combinaciones de habilidades, conocimientos y actitudes que permiten desempeñarse eficazmente","Los requisitos mínimos que exige un puesto de trabajo"], c:2, exp:"Las competencias son combinaciones de habilidades, conocimientos y actitudes que permiten desempeñarse eficazmente en un contexto." },
    { tema:5, q:"¿Cuál de las siguientes es una competencia TÉCNICA?", opts:["Trabajo en equipo","Comunicación efectiva","Programación o contabilidad","Resiliencia"], c:2, exp:"La programación o la contabilidad son competencias técnicas, ligadas a conocimientos específicos de un ámbito profesional." },
    { tema:5, q:"¿Qué competencia transversal desarrolla el aprendizaje autónomo al planificar el propio estudio y cumplir plazos?", opts:["Pensamiento crítico","Autogestión","Motivación extrínseca","Liderazgo"], c:1, exp:"Al planificar el propio estudio y cumplir plazos, el aprendizaje autónomo desarrolla la autogestión como competencia transversal." },
    { tema:5, q:"La motivación intrínseca en el aprendizaje autónomo se define como:", opts:["El deseo de aprender para obtener una recompensa económica","La motivación generada por el reconocimiento de los demás","El deseo de aprender por el propio interés y satisfacción personal","La presión externa que obliga a seguir formándose"], c:2, exp:"La motivación intrínseca es el deseo de aprender por el propio interés y satisfacción personal, sin depender de recompensas externas." },
    { tema:5, q:"¿Cuál de estas NO es una estrategia para fomentar el aprendizaje autónomo según el tema?", opts:["Establecer metas claras","Planificar el tiempo de estudio","Esperar a que el profesor indique exactamente qué estudiar","Evaluar el propio progreso regularmente"], c:2, exp:"Esperar instrucciones del profesor contradice la esencia del aprendizaje autónomo, que implica tomar la iniciativa del propio aprendizaje." },
    { tema:5, q:"¿Cómo define el tema la empleabilidad?", opts:["La capacidad de encontrar empleo en menos de tres meses","El conjunto de competencias, habilidades y actitudes que permiten entrar, mantenerse y progresar en el mercado laboral","El nivel de estudios necesario para acceder a un puesto de trabajo","Las referencias laborales que avalan la trayectoria profesional"], c:1, exp:"La empleabilidad es el conjunto de competencias, habilidades y actitudes que permiten a una persona entrar, mantenerse y progresar en el mercado laboral." },
    { tema:5, q:"¿Qué característica de la empleabilidad describe la actitud de anticiparse a las oportunidades sin esperar a que lleguen solas?", opts:["Desarrollo del autoconocimiento","Voluntad de seguir aprendiendo","Responsabilidad y proactividad en la búsqueda de empleo","Dominio de herramientas de búsqueda"], c:2, exp:"La responsabilidad y proactividad en la búsqueda de empleo implica anticiparse a las oportunidades sin esperar pasivamente a que lleguen." }
  ];

  const SCORE_OK  = 10 / qs.length;        // 0.25 por pregunta correcta (10/40)
  const SCORE_BAD = -SCORE_OK / 4;         // –0.0625

  let cur = 0, answered = Array(qs.length).fill(null), selected = Array(qs.length).fill(null), showRes = false;

  function calcScore() {
    let s = 0;
    qs.forEach((q, i) => {
      if (answered[i] === null) return;
      s += answered[i] === q.c ? SCORE_OK : SCORE_BAD;
    });
    return s;
  }

  function render() {
    if (showRes) { renderRes(); return; }
    const q = qs[cur];
    const isAns = answered[cur] !== null;
    const prog = ((cur + 1) / qs.length) * 100;
    const prevTema = cur > 0 ? qs[cur - 1].tema : null;
    const showLabel = !prevTema || prevTema !== q.tema;

    document.getElementById('pb').style.width = prog + '%';

    const body = document.getElementById('qz-body');
    body.innerHTML = `
    <div class="stats-bar">
      <span class="qnum">Pregunta ${cur + 1} / ${qs.length}</span>
      <span>${answered.filter(a => a !== null).length} respondidas · ${answered.filter(a => a === null).length} restantes</span>
    </div>
    ${showLabel ? `<div class="section-label">${TEMAS[q.tema]}</div>` : ''}
    <div class="qt">${q.q}</div>
    <div class="opts">
      ${q.opts.map((o, i) => {
      let cls = 'opt';
      if (isAns && i === selected[cur]) cls += ' selected';
      return `<button class="${cls}" onclick="ans(${i})" ${isAns ? 'disabled' : ''}>
          <span class="olbl">${String.fromCharCode(65+i)}</span>
          <span>${o}</span>
        </button>`;
    }).join('')}
    </div>
    <div class="exp-box" id="exp">${q.exp}</div>
    <div class="nav">
      <button class="btn" onclick="go(-1)" ${cur === 0 ? 'disabled' : ''}>← Anterior</button>
      <button class="btn blank" onclick="goBlank()">Dejar en blanco →</button>
      ${cur === qs.length - 1
            ? `<button class="btn pri" onclick="tryFinish()">Ver resultados →</button>`
            : `<button class="btn pri" onclick="go(1)">Siguiente →</button>`}
    </div>`;
  }

  function ans(idx) {
    if (answered[cur] !== null) return;
    selected[cur] = idx;
    answered[cur] = idx;
    render();
  }

  function goBlank() { go(1); }

  function go(d) {
    const next = cur + d;
    if (next < 0) return;
    if (next >= qs.length) { tryFinish(); return; }
    cur = next; render();
  }

  function tryFinish() {
    const u = answered.filter(a => a === null).length;
    if (u > 0) {
      if (!confirm(`Tienes ${u} pregunta(s) sin responder.\nLas preguntas en blanco no suman ni restan.\n\n¿Finalizar el examen?`)) return;
    }
    showRes = true; render();
  }

  function renderRes() {
    const correct = qs.filter((q, i) => answered[i] === q.c).length;
    const wrong   = qs.filter((q, i) => answered[i] !== null && answered[i] !== q.c).length;
    const blank   = qs.filter((q, i) => answered[i] === null).length;
    const raw     = calcScore();
    const final   = Math.max(0, raw);
    const display = final.toFixed(2);
    const passed  = final >= 5;
    const msg     = final >= 9 ? '¡Excelente resultado!' : final >= 7 ? 'Buen trabajo' : final >= 5 ? 'Aprobado' : 'Suspenso';
    const temas   = [...new Set(qs.map(q => q.tema))];

    document.getElementById('pb').style.width = '100%';
    document.getElementById('qz-body').innerHTML = `
    <div class="res">
      <div class="sc-circle ${passed ? 'passed' : 'failed'}">
        <span class="sc-big">${display}</span>
        <span class="sc-den">sobre 10</span>
      </div>
      <div class="res-t">${msg}</div>
      <div class="res-s">Modelo 1 · Examen de simulación IPEI</div>
      <div class="score-formula">
        <span class="sf-item correct-sf">✓ ${correct} correctas × ${SCORE_OK.toFixed(4)}</span>
        <span class="sf-sep">−</span>
        <span class="sf-item wrong-sf">✗ ${wrong} incorrectas × ${Math.abs(SCORE_BAD).toFixed(4)}</span>
        <span class="sf-sep">=</span>
        <span class="sf-result">${raw.toFixed(4)}</span>
      </div>
      <div class="sg">
        <div class="sc"><div class="sc-n" style="color:#1D9E75">${correct}</div><div class="sc-l">Correctas</div></div>
        <div class="sc"><div class="sc-n" style="color:#E24B4A">${wrong}</div><div class="sc-l">Incorrectas</div></div>
        <div class="sc"><div class="sc-n" style="color:#888">>${blank}</div><div class="sc-l">En blanco</div></div>
      </div>
      <button class="btn pri btn-reiniciar" onclick="restart()">Repetir examen</button>
      <div class="rev">
        <div class="rev-t">Repaso por temas</div>
        ${temas.map(tema => {
      const tqs = qs.map((q,i)=>({...q,idx:i})).filter(q=>q.tema===tema);
      return `<div class="tema-block">
            <div class="tema-block-title">${TEMAS[tema]}</div>
            ${tqs.map(q => {
        const isC = answered[q.idx] === q.c;
        const wasA = answered[q.idx] !== null;
        const cls = wasA ? (isC ? 'rc' : 'rw') : 'rb';
        return `<div class="ri ${cls}">
                <strong>P${q.idx+1}:</strong> ${q.q}
                <span class="ri-detail">${wasA
                ? (isC ? '✓ Tu respuesta: ' + q.opts[answered[q.idx]]
                        : '✗ Tu respuesta: ' + q.opts[answered[q.idx]] + ' · Correcta: ' + q.opts[q.c])
                : '— En blanco · Correcta: ' + q.opts[q.c]}</span>
                <span class="ri-exp">${q.exp}</span>
              </div>`;
      }).join('')}
          </div>`;
    }).join('')}
      </div>
    </div>`;
  }

  function restart() {
    cur = 0; answered = Array(qs.length).fill(null); selected = Array(qs.length).fill(null); showRes = false; render();
  }

  render();
</script>
</body>
</html>
